<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePath Cyber Prework Self-Check</title>
<style>
  :root { --bg:#0f1419; --card:#1a2027; --fg:#e6edf3; --muted:#9aa7b2; --accent:#4da3ff; --border:#2a323c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding:2rem 1rem; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  .sub { color:var(--muted); margin:0 0 1.5rem; }
  a.card { display:block; text-decoration:none; color:var(--fg); background:var(--card);
    border:1px solid var(--border); border-radius:10px; padding:1.1rem 1.2rem; margin-bottom:1rem; }
  a.card:hover { border-color:var(--accent); }
  .name { font-weight:700; font-size:1.1rem; }
  .desc { color:var(--muted); font-size:.92rem; margin-top:.2rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CodePath Cyber Prework Self-Check</h1>
  <p class="sub">Choose your course to check your prework answers in the browser.</p>
  <a class="card" href="cyb101/">
    <div class="name">CYB101 Prework &rarr;</div>
    <div class="desc">Check your three challenge answers and get your magic code.</div>
  </a>
  <a class="card" href="cyb102/">
    <div class="name">CYB102 Prework &rarr;</div>
    <div class="desc">Check your three <code>bash</code> commands (echo, chmod, cp).</div>
  </a>
</div>
</body>
</html>
